<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Game</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card-bg: #2b2b36;
      --text: #ffffff;
      --accent: #6264a7;
      --accent-hover: #7b7dc1;
      --danger: #e24a4a;
      --success: #38a169;
      --card-border: #444454;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      max-width: 650px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 8px; color: #e1e4e8; }
    p.subtitle { color: #9aa0a6; margin-bottom: 24px; font-size: 15px; }
    .stats-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .stat-val { font-size: 32px; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 13px; color: #8c959f; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      min-height: 120px;
      margin-bottom: 28px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px dashed var(--card-border);
    }
    .card-item {
      width: 64px;
      height: 90px;
      background: #3b3c4c;
      border: 2px solid #57596f;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-item.duplicate {
      border-color: var(--danger);
      background: rgba(226, 74, 74, 0.25);
      color: var(--danger);
      animation: shake 0.4s ease-in-out;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-stay { background: #3c4043; color: white; border: 1px solid #5f6368; }
    .btn-stay:hover:not(:disabled) { background: #50555a; }
    .btn-play-again { background: var(--success); color: white; display: none; }
    .btn-play-again:hover { background: #48bb78; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .banner {
      font-size: 18px;
      font-weight: 600;
      min-height: 28px;
      margin-bottom: 16px;
    }
    .banner.bust { color: var(--danger); }
    .banner.banked { color: var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Flip Cards</h1>
    <p class="subtitle">Draw unique cards (0–12). Draw a duplicate and you bust!</p>

    <div class="stats-card">
      <div>
        <div class="stat-val" id="score">0</div>
        <div class="stat-lbl">Current Score</div>
      </div>
      <div>
        <div class="stat-val" id="card-count">0</div>
        <div class="stat-lbl">Cards Drawn</div>
      </div>
      <div>
        <div class="stat-val" id="risk">0%</div>
        <div class="stat-lbl">Bust Risk</div>
      </div>
    </div>

    <div class="banner" id="banner"></div>

    <div class="cards-grid" id="cards-grid"></div>

    <div class="actions">
      <button class="btn-primary" id="btn-draw" onclick="drawCard()">Draw Card</button>
      <button class="btn-stay" id="btn-stay" onclick="stay()">Stay & Bank</button>
      <button class="btn-play-again" id="btn-again" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    // Deck: 0 (1 copy), 1 (1 copy), 2 (2 copies), ..., 12 (12 copies) = 79 cards total
    function buildDeck() {
      let d = [0];
      for (let i = 1; i <= 12; i++) {
        for (let j = 0; j < i; j++) d.push(i);
      }
      return d;
    }

    let deck = [];
    let hand = [];
    let gameOver = false;

    function resetGame() {
      deck = buildDeck();
      // Shuffle
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      hand = [];
      gameOver = false;
      document.getElementById("cards-grid").innerHTML = "";
      document.getElementById("banner").innerText = "";
      document.getElementById("banner").className = "banner";
      document.getElementById("btn-draw").style.display = "inline-block";
      document.getElementById("btn-stay").style.display = "inline-block";
      document.getElementById("btn-draw").disabled = false;
      document.getElementById("btn-stay").disabled = true;
      document.getElementById("btn-again").style.display = "none";
      updateStats();
    }

    function calculateRisk() {
      if (hand.length === 0) return 0;
      let bustCards = 0;
      for (const card of hand) {
        // Remaining copies of this card in deck
        bustCards += deck.filter(c => c === card).length;
      }
      return ((bustCards / deck.length) * 100).toFixed(0);
    }

    function updateStats() {
      const score = hand.reduce((a, b) => a + b, 0);
      document.getElementById("score").innerText = score;
      document.getElementById("card-count").innerText = hand.length;
      document.getElementById("risk").innerText = calculateRisk() + "%";
    }

    function drawCard() {
      if (gameOver || deck.length === 0) return;
      const card = deck.pop();
      const isDuplicate = hand.includes(card);

      const grid = document.getElementById("cards-grid");
      const el = document.createElement("div");
      el.className = "card-item" + (isDuplicate ? " duplicate" : "");
      el.innerText = card;
      grid.appendChild(el);

      if (isDuplicate) {
        gameOver = true;
        const banner = document.getElementById("banner");
        banner.innerText = "💥 BUST! You drew a duplicate (" + card + "). Final Score: 0";
        banner.className = "banner bust";
        document.getElementById("btn-draw").style.display = "none";
        document.getElementById("btn-stay").style.display = "none";
        document.getElementById("btn-again").style.display = "inline-block";
        document.getElementById("score").innerText = "0";
        document.getElementById("risk").innerText = "100%";
      } else {
        hand.push(card);
        document.getElementById("btn-stay").disabled = false;
        updateStats();
      }
    }

    function stay() {
      if (gameOver || hand.length === 0) return;
      gameOver = true;
      const score = hand.reduce((a, b) => a + b, 0);
      const banner = document.getElementById("banner");
      banner.innerText = "🎉 BANKED! You scored " + score + " points with " + hand.length + " cards!";
      banner.className = "banner banked";
      document.getElementById("btn-draw").style.display = "none";
      document.getElementById("btn-stay").style.display = "none";
      document.getElementById("btn-again").style.display = "inline-block";
    }

    resetGame();
  </script>
</body>
</html>
