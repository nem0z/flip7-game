<!DOCTYPE html>
<html>
<head>
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h3>Flip Card Game Configuration</h3>
  <p>Click Save to add the game tab to this channel.</p>
  <script>
    microsoftTeams.app.initialize().then(() => {
      microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
        microsoftTeams.pages.config.setConfig({
          entityId: "flipCardGameTab",
          contentUrl: "https://nem0z.github.io/flip7-game/",
          suggestedDisplayName: "Flip Card Game",
          websiteUrl: "https://nem0z.github.io/flip7-game/"
        });
        saveEvent.notifySuccess();
      });
      microsoftTeams.pages.config.setValidityState(true);
    });
  </script>
</body>
</html>
